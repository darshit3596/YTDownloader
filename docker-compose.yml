services:
  ytdownloader:
    build: .
    container_name: ytdownloader
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: "*"
      DATABASE_URL: "file:/app/storage/mediaflow.db"
      STORAGE_ROOT: "/app/storage"
      MAX_CONCURRENT_JOBS: 1
    volumes:
      - ./storage:/app/storage
